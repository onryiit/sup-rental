<div class="auth-page">
  <div class="wave-bg"></div>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🏄</div>
      <h1>SUP Kiralama</h1>
      <p>Hesabınıza giriş yapın</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>E-posta</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" formControlName="email" placeholder="ornek@email.com" autocomplete="email" />
        </div>
        <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Geçerli bir e-posta girin
        </span>
      </div>

      <div class="field">
        <label>Şifre</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Şifreniz" autocomplete="current-password" />
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          En az 6 karakter
        </span>
      </div>

      <div class="error-banner" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Giriş Yap</span>
        <span *ngIf="loading" class="btn-spinner"></span>
      </button>
    </form>

    <div class="divider"><span>veya</span></div>

    <p class="alt-link">Hesabınız yok mu? <a routerLink="/register">Kayıt Ol</a></p>

    <div class="demo-hint">
      <strong>Demo:</strong> ali&#64;test.com / 123456
    </div>
  </div>
</div>
