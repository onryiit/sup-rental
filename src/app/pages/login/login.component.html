<div class="auth-page">
  <div class="wave-bg"></div>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🏄</div>
      <h1>Aqua SUP</h1>
      <p>{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>{{ 'AUTH.EMAIL' | translate }}</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" formControlName="email"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
            autocomplete="email" />
        </div>
        <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          {{ 'AUTH.EMAIL_ERROR' | translate }}
        </span>
      </div>

      <div class="field">
        <label>{{ 'AUTH.PASSWORD' | translate }}</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate"
            autocomplete="current-password" />
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          {{ 'AUTH.PASSWORD_ERROR' | translate }}
        </span>
      </div>

      <div class="error-banner" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">{{ 'AUTH.LOGIN_BTN' | translate }}</span>
        <span *ngIf="loading" class="btn-spinner"></span>
      </button>
    </form>

    <div class="divider"><span>{{ 'AUTH.NO_ACCOUNT' | translate }}</span></div>
    <p class="alt-link">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a routerLink="/register">{{ 'AUTH.REGISTER_BTN' | translate }}</a>
    </p>
  </div>
</div>
