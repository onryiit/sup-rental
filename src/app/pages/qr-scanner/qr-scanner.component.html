<div class="scanner-page">

  <!-- Header -->
  <div class="scanner-header">
    <button class="back-btn" (click)="goBack()">← Geri</button>
    <span class="title">QR Tara</span>
    <span></span>
  </div>

  <!-- Camera View -->
  <div class="camera-area" *ngIf="state === 'scanning' || state === 'idle'">
    <div id="qr-reader" class="qr-reader"></div>
    <div class="scan-overlay">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-line"></div>
    </div>
    <p class="scan-hint">SUP kabininin üzerindeki QR kodu çerçeve içine alın</p>
  </div>

  <!-- Found -->
  <div class="feedback-card success" *ngIf="state === 'found'">
    <div class="fb-icon">✅</div>
    <h2>QR Kod Okundu!</h2>
    <p>Yönlendiriliyorsunuz...</p>
    <code>{{ scannedCode }}</code>
  </div>

  <!-- Camera denied -->
  <div class="feedback-card warn" *ngIf="state === 'denied'">
    <div class="fb-icon">📵</div>
    <h2>Kamera İzni Gerekli</h2>
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Camera error -->
  <div class="feedback-card error" *ngIf="state === 'error'">
    <div class="fb-icon">⚠️</div>
    <h2>Kamera Açılamadı</h2>
    <p>{{ errorMessage }}</p>
    <button class="btn-retry" (click)="startScan()">Tekrar Dene</button>
  </div>

  <!-- Manual code entry (fallback) -->
  <div class="manual-section" *ngIf="state !== 'found'">
    <div class="divider-or"><span>veya kodu elle girin</span></div>
    <div class="manual-row">
      <input #manualInput type="text" placeholder="QR-OLUD-001" class="manual-input" />
      <button class="btn-manual" (click)="enterManual(manualInput.value)">Git →</button>
    </div>
    <p class="manual-hint">Test için: <strong>QR-OLUD-001</strong></p>
  </div>

</div>
